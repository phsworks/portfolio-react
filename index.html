<!doctype html>
<html lang="nl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta id="meta-description" name="description"
    content="Full-stack developer uit Amsterdam. Ik bouw websites, web-apps en mobiele apps met React, React Native en Node.js." />
  <meta id="meta-keywords" name="keywords"
    content="softwareontwikkeling, digitale oplossingen, phs development" />
  <meta id="meta-author" name="author" content="phs development" />

  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">

  <title id="page-title">Piet-Hein Schouten | Full-stack Developer</title>
  <script type="module" src="/src/main.jsx"></script>
</head>

<body>
  <div id="root"></div>
  <script>
    // older visits may have stored e.g. "en-US"
    const stored = (localStorage.getItem('i18nextLng') || 'nl').slice(0, 2);
    const language = stored === 'en' ? 'en' : 'nl';
    document.documentElement.lang = language;

    const metaTags = {
      nl: {
        description: "Full-stack developer uit Amsterdam. Ik bouw websites, web-apps en mobiele apps met React, React Native en Node.js.",
        keywords: "softwareontwikkeling, digitale oplossingen, phs development",
        author: "phs development",
        title: "Piet-Hein Schouten | Full-stack Developer"
      },
      en: {
        description: "Full-stack developer from Amsterdam. I build websites, web apps and mobile apps with React, React Native and Node.js.",
        keywords: "software development, digital solutions, phs development",
        author: "phs development",
        title: "Piet-Hein Schouten | Full-stack Developer"
      }
    };

    document.getElementById('meta-description').setAttribute('content', metaTags[language].description);
    document.getElementById('meta-keywords').setAttribute('content', metaTags[language].keywords);
    document.getElementById('meta-author').setAttribute('content', metaTags[language].author);
    document.getElementById('page-title').textContent = metaTags[language].title;
  </script>
</body>

</html>
